name: release

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install workspace
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "grove-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Plan, commit, tag and push
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.mjs --commit

      - name: Webview build and bundle guard
        if: steps.release.outputs.skip != 'true'
        run: bun run build

      - name: Build the signed NSIS installer
        if: steps.release.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Build the updater manifest
        if: steps.release.outputs.skip != 'true'
        id: manifest
        run: >
          bun scripts/release-manifest.mjs
          --version "${{ steps.release.outputs.version }}"
          --tag "${{ steps.release.outputs.tag }}"
          --repo "${{ github.repository }}"
          --notes .release/notes.md

      - name: Publish the release
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets=(
            "${{ steps.manifest.outputs.installer }}"
            "${{ steps.manifest.outputs.sig }}"
            "${{ steps.manifest.outputs.latest }}"
            "${{ steps.manifest.outputs.sums }}"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Grove $VERSION" --notes-file .release/notes.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Grove $VERSION" \
              --notes-file .release/notes.md
          fi

      - name: Summary
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          echo "Released **${{ steps.release.outputs.tag }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat .release/notes.md >> "$GITHUB_STEP_SUMMARY"
