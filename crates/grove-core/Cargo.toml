[package]
name = "grove-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Grove's durable core: adapters, sessions, store, spec graph, plan, skills, MCP, git"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
keyring = "4.2.0"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util", "fs"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
