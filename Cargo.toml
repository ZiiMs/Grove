[workspace]
resolver = "2"
members = ["crates/grove-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Grove contributors"]

[workspace.dependencies]
grove-core = { path = "crates/grove-core" }

# Local build speed: skip optimisation and full debug info, let rustc split the work widely, and
# cache compiled crates with sccache. sccache refuses incremental compilation, so incremental stays
# off while the wrapper is configured; remove the wrapper first if you want the old incremental loop.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false
codegen-units = 256

[profile.dev.package."*"]
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = false
